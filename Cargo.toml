[package]
name = "gbrute"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.88"
chrono = "0.4.41"
clap = { version="4.5.39", features=["derive"] }
futures = "0.3.31"
indicatif = "0.17.11"
reqwest = { version="0.12.18", features=["rustls-tls"] }
tokio = {version="1.45.1", features=["rt-multi-thread","macros", "fs"] }
